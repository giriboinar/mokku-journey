# ---------------------------------------------------------------------------
# Raja's Tirumala Journey — Docker Build, Scan & Push
#
# Pipeline: docker build -> Trivy scan (fails on HIGH/CRITICAL) ->
#           Docker Hub push (main branch only, via repo secrets
#           DOCKERHUB_USERNAME and DOCKERHUB_TOKEN).
# ---------------------------------------------------------------------------
name: Docker Build, Scan & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: giriboinar/raja-tirumala-journey

jobs:
  build-scan-push:
    name: Build, scan and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t "$IMAGE_NAME:${{ github.sha }}" -t "$IMAGE_NAME:latest" .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"
